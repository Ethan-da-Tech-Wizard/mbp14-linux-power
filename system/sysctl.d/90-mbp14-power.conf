# Kernel tunables for battery life. Install as /etc/sysctl.d/90-mbp14-power.conf, apply with `sudo sysctl --system`.
# Undo: delete the file and reboot (or write the old values back). Values are the ones we chose, not upstream defaults.
vm.laptop_mode = 5
vm.dirty_writeback_centisecs = 1500
kernel.nmi_watchdog = 0
kernel.timer_migration = 0
