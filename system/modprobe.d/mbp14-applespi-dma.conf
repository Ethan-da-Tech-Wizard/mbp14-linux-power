# Module options for the Apple SPI keyboard/touchpad driver (`applespi`) on the "BookPro14,1" laptop.
# Install as /etc/modprobe.d/mbp14-applespi-dma.conf. Undo: delete the file and reboot.
#
# softdep: load the Intel LPSS DMA engine (idma64) BEFORE the SPI controller driver and applespi, so the SPI controller can use
#   DMA instead of programmed I/O for touchpad packets. STATUS: this is an EMPIRICAL local setting. We found no upstream
#   source saying it reduces touchpad lag or dropped events, and a 2026 kernel patch series reports DMA problems on a
#   DIFFERENT Apple model (and adds a force-PIO option). Treat it as something to try and measure on your own unit, not as a
#   documented fix. To test: remove this file, reboot, compare how scrolling feels and whether `dmesg | grep -i applespi` shows errors.
softdep spi_pxa2xx_platform pre: idma64
softdep applespi pre: idma64

# fnmode=1 is the driver's default ("F-keys last": F-keys need the Fn key). Other values: 0 = Fn disabled, 2 = F-keys first.
# Check the real list on your kernel with `modinfo applespi`. Other parameters there: fnremap, iso_layout, touchpad_dimensions.
options applespi fnmode=1
