# Module options that save battery power. Install as /etc/modprobe.d/90-mbp14-power.conf. Undo: delete the file and reboot.
# snd_hda_intel: power the audio codec down after 1 s of silence.  nvme_core: allow NVMe states with up to 25 ms exit latency
# (Autonomous Power State Transition). Both are values we chose; they trade a little wake-up latency for power.
options snd_hda_intel power_save=1 power_save_controller=Y
options nvme_core default_ps_max_latency_us=25000
